[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-enterprise-blueprint"
version = "0.1.0"
description = "FastAPI enterprise architecture with RBAC, encrypted PII, and a Tantivy search index"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "bcrypt>=4.2,<6",
    "cryptography>=43,<46",
    "fastapi>=0.115,<1",
    "PyJWT>=2.9,<3",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5.1,<7",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "tantivy>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
